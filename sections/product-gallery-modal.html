<div id="modalRoot" class="fixed inset-0 z-[100] hidden overflow-y-auto" style="background: rgba(11, 16, 21, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);">
  <div class="min-h-full flex items-start md:items-center justify-center p-3 md:p-8">
    <div id="modalCard" class="relative w-full max-w-5xl bg-brand-cream rounded-3xl overflow-hidden shadow-2xl border border-brand-gold/30">

      <!-- Modal Header Bar -->
      <div class="sticky top-0 z-20 flex items-center justify-between gap-3 px-6 md:px-8 py-5 bg-brand-cream/95 backdrop-blur-xl border-b border-brand-line/60">
        <div class="flex items-center gap-3 md:gap-4 min-w-0">
          <button id="modalBack" type="button" class="hidden shrink-0 w-10 h-10 grid place-items-center rounded-full bg-brand-sand text-brand-ink hover:bg-brand-sand-dark transition-colors" aria-label="Back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </button>
          <div class="min-w-0">
            <div id="modalEyebrow" class="eyebrow text-[10px] text-brand-gold-dark font-semibold tracking-widest-2">Collection</div>
            <h3 id="modalTitle" class="font-display text-lg md:text-2xl text-brand-ink font-medium leading-tight truncate">Piece Details</h3>
          </div>
        </div>

        <button id="modalClose" type="button" class="shrink-0 w-10 h-10 grid place-items-center rounded-full bg-brand-sand text-brand-ink hover:bg-brand-sand-dark transition-colors" aria-label="Close Modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- Modal Body (Injected dynamically by modal.js) -->
      <div id="modalBody" class="p-6 md:p-10 max-h-[80vh] overflow-y-auto"></div>

    </div>
  </div>
</div>
