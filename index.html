<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F3D4C" />
  <title>Sami Furniture House — Premium Furniture, Crafted in Gujranwala</title>
  <meta name="description" content="Premium, hand-crafted furniture for the modern Pakistani home. Sofas, beds, dining sets and office furniture, designed and built in Gujranwala." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind Play CDN + custom theme -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind.config.js"></script>

  <!-- Project styles -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="font-body bg-brand-bg text-brand-ink">

  <!-- ============================================================
       PAGE COMPOSITION
       ============================================================
       Each slot below is replaced at runtime with the matching
       partial from /sections/<name>.html by assets/js/sections.js.
       ============================================================ -->
  <div data-include="navbar"></div>
  <div data-include="hero"></div>
  <div data-include="brand-statement"></div>
  <div data-include="categories"></div>
  <div data-include="featured-pieces"></div>
  <div data-include="why-choose-us"></div>
  <div data-include="showroom"></div>
  <div data-include="testimonials"></div>
  <div data-include="final-cta"></div>
  <div data-include="footer"></div>
  <div data-include="product-gallery-modal"></div>
  <div data-include="floating-whatsapp"></div>


  <!-- ============================================================
       SCRIPTS
       ============================================================ -->
  <!-- GSAP for animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- App scripts (load order matters) -->
  <script src="assets/js/sections.js"></script>
  <script src="assets/js/data.js"></script>

  <!-- The remaining scripts must wait until the sections are
       in the DOM. sections.js fires a `sections:loaded` event
       once all partials are injected. -->
  <script>
    document.addEventListener('sections:loaded', function () {
      // Load scripts that bind to DOM elements
      const scripts = [
        'assets/js/ui.js',
        'assets/js/modal.js',
        'assets/js/featured.js',
        'assets/js/animations.js',
        'assets/js/main.js',
      ];
      scripts.forEach(function (src) {
        const s = document.createElement('script');
        s.src = src;
        s.defer = false;
        document.body.appendChild(s);
      });
    });
  </script>
</body>
</html>
