  <!-- ============================================================

  <!-- App scripts (load order matters) -->
  <script src="assets/js/sections.js"></script>
  <script src="assets/js/data.js"></script>

  <!-- The remaining scripts must wait until the sections are
       in the DOM. sections.js fires a `sections:loaded` event
       once all partials are injected. -->
  <script>
    document.addEventListener('sections:loaded', function () {
      // Load scripts that bind to DOM elements
      const scripts = [
        'assets/js/ui.js',
        'assets/js/modal.js',
        'assets/js/featured.js',
        'assets/js/animations.js',
        'assets/js/main.js',
      ];
      scripts.forEach(function (src) {
        const s = document.createElement('script');
        s.src = src;
        s.defer = false;
        document.body.appendChild(s);
      });
    });
  </script>
